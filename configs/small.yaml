# Small configuration: a ~50M parameter model intended for GPU training on
# OpenWebText with a trained SentencePiece tokenizer.
#
# Before training, build the tokenizer, e.g.:
#   python -m data.tokenizer train \
#     --input corpus.txt --model-prefix tokenizer/spm --vocab-size 32000

seed: 42
device: auto

tokenizer:
  backend: sentencepiece
  model_path: tokenizer/spm.model

data:
  name: openwebtext   # tinystories | openwebtext | fineweb
  seq_len: 1024
  streaming: true
  add_eos: true
  num_workers: 4
  train_split: train
  val_split: train     # OpenWebText ships a single split; hold out via streaming

model:
  vocab_size: 32000
  d_model: 512
  n_layers: 8
  n_heads: 8
  max_seq_len: 1024
  mlp_ratio: 4
  n_timesteps: 1
  causal: true
  dropout: 0.0
  tie_embeddings: true

training:
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  grad_accum_steps: 4
  epochs: 1
  max_steps: 100000
  warmup_steps: 2000
  min_lr_ratio: 0.1
  amp: true
  amp_dtype: bfloat16
  log_interval: 50
  eval_interval: 2000
  eval_max_batches: 100
  save_interval: 5000
  checkpoint_dir: checkpoints

generation:
  max_new_tokens: 256
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  greedy: false
