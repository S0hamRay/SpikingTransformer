# Tiny configuration: fast, CPU-friendly smoke runs on TinyStories.
# Uses the dependency-free byte tokenizer so no tokenizer training or network
# access is required for the tokenizer itself.

seed: 42
device: auto          # auto | cpu | cuda | mps

tokenizer:
  backend: byte       # byte | sentencepiece | tiktoken
  # model_path: tokenizer/spm.model   # required for the sentencepiece backend
  # encoding_name: gpt2               # used by the tiktoken backend

data:
  name: tinystories   # tinystories | openwebtext | fineweb
  seq_len: 128
  streaming: true
  add_eos: true
  num_workers: 2
  train_split: train
  val_split: validation

model:
  vocab_size: 259     # byte tokenizer: 256 bytes + 3 special tokens
  d_model: 128
  n_layers: 4
  n_heads: 4
  max_seq_len: 128
  mlp_ratio: 4
  n_timesteps: 1      # spiking attention timesteps
  causal: true
  dropout: 0.0
  tie_embeddings: true

training:
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  grad_accum_steps: 1
  epochs: 1
  max_steps: 2000
  warmup_steps: 100
  min_lr_ratio: 0.1
  amp: false
  amp_dtype: bfloat16
  log_interval: 20
  eval_interval: 500
  eval_max_batches: 50
  save_interval: 1000
  checkpoint_dir: checkpoints

generation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 40
  top_p: 0.95
  greedy: false
